name: ci

# Two layers, each fanning out over its own runners.
#
#   integration — the backend alone, driven through the facade
#   e2e         — the same backend with a web app and a browser in front
#
# They are separate stages rather than more legs of one because they cost
# different amounts to START. With container fixtures the wall-clock is
# dominated by bringing the environment up, so splitting evenly by test count
# would have every runner pay the same setup for a fraction of the work.
#
# Nothing here lists the classes. scripts/suites.py reads them out of the built
# assembly and refuses to emit a matrix at all if a class belongs to no suite --
# because a class that runs on no runner is indistinguishable from one that
# passes.
#
# MAX_PARALLEL caps the legs PER SUITE and packs the classes into them. e2e is
# capped at 1 deliberately: its classes share a collection, so one leg runs them
# in a single process against ONE set of containers. Split across two legs they
# each rebuilt a facade, a web app and a browser -- measured at 95s and 91s,
# almost entirely setup, against ~95s for both together.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The failure mode here is not a commit: it is a new host release changing
    # something this demo relies on, and nothing would push here to reveal it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  discover:
    name: Discover suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    env:
      MAX_PARALLEL: default=2,e2e=1
    steps:
      - uses: actions/checkout@v5

      # Best-effort: a miss just falls back to balancing by test count, which
      # is why nothing here fails when the cache is cold.
      - uses: actions/cache/restore@v4
        with:
          path: timings.json
          key: timings-${{ github.run_id }}
          restore-keys: timings-
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build tests/OrderBook.Tests/OrderBook.Tests.csproj -c Release
        name: Build tests

      - id: suites
        name: Enumerate and pack suites (fails if a class has no suite)
        run: |
          set -euo pipefail
          MATRIX="$(./scripts/suites.py \
            tests/OrderBook.Tests/bin/Release/net10.0/OrderBook.Tests \
            --max-parallel "$MAX_PARALLEL" \
            --timings timings.json)"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.leg.name }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # Every leg reports. Stopping the others on one failure hides whether the
      # problem is one class or the shared environment.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.discover.outputs.matrix).integration }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # matrix.leg.args is a ready-made "-class A -class B", so the classes on
      # one leg run in a SINGLE process and share whatever fixture their
      # collection defines. Building the arguments here from an array would
      # lose that.
      - name: Run ${{ matrix.leg.classes }}
        run: |
          set -euo pipefail
          dotnet build tests/OrderBook.Tests/OrderBook.Tests.csproj -c Release
          tests/OrderBook.Tests/bin/Release/net10.0/OrderBook.Tests \
            ${{ matrix.leg.args }} \
            -trx "${{ matrix.leg.name }}.trx" \
            -xml "${{ matrix.leg.name }}.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.leg.name }}
          path: |
            *.trx
            *.xml
          if-no-files-found: error

  e2e:
    name: ${{ matrix.leg.name }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.discover.outputs.matrix).e2e }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Each leg builds its OWN facade, web app and browser. Testcontainers
      # randomises names, networks and host ports, so nothing needs coordinating
      # between runners -- the isolation is a property of the fixtures.
      # matrix.leg.args is a ready-made "-class A -class B", so the classes on
      # one leg run in a SINGLE process and share whatever fixture their
      # collection defines. Building the arguments here from an array would
      # lose that.
      - name: Run ${{ matrix.leg.classes }}
        run: |
          set -euo pipefail
          dotnet build tests/OrderBook.Tests/OrderBook.Tests.csproj -c Release
          tests/OrderBook.Tests/bin/Release/net10.0/OrderBook.Tests \
            ${{ matrix.leg.args }} \
            -trx "${{ matrix.leg.name }}.trx" \
            -xml "${{ matrix.leg.name }}.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.leg.name }}
          path: |
            *.trx
            *.xml
          if-no-files-found: error

  timings:
    name: Record timings
    needs: [integration, e2e]
    # Always: a failing leg still produces timings for the ones that ran, and
    # losing them would make the next run's balancing worse precisely when the
    # suite is already unhappy.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v4
        with:
          path: timings.json
          key: timings-${{ github.run_id }}
          restore-keys: timings-

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true

      # An exponentially weighted average, so a class that gets slower shows up
      # within a few runs rather than being diluted by history.
      - name: Fold this run into the rolling averages
        run: ./scripts/timings.py timings.json *.xml

      - run: cat timings.json

      # Keyed by run id and restored by prefix, so every run reads the most
      # recent entry and writes a new one. GitHub evicts the old ones.
      - uses: actions/cache/save@v4
        with:
          path: timings.json
          key: timings-${{ github.run_id }}
