name: ci

# Two layers, each fanning out over its own runners.
#
#   integration — the backend alone, driven through the facade
#   e2e         — the same backend with a web app and a browser in front
#
# They are separate stages rather than more legs of one because they cost
# different amounts to START. With container fixtures the wall-clock is
# dominated by bringing the environment up, so splitting evenly by test count
# would have every runner pay the same setup for a fraction of the work.
#
# Nothing here names a project or a class. scripts/suites.sh reads the solution
# and identifies suites by project NAME -- *.IntegrationTests and *.E2ETests --
# then reads the classes out of the built assemblies. Adding a test project to
# OrderBook.slnx is all it takes to get a runner, and one matching neither
# pattern is fatal rather than silently skipped, because running on no runner
# is indistinguishable from passing.
#
# MAX_PARALLEL caps the legs PER SUITE. e2e is capped at 1 deliberately: its
# classes share a collection, so one leg runs them in a single process against
# ONE set of containers. Split across legs they each rebuild SQL Server, the
# API, the Angular host and a browser, which is 94-99% of a leg's wall-clock.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The failure mode here is not a commit: it is a new host release changing
    # something this demo relies on, and nothing would push here to reveal it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  discover:
    name: Discover suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    env:
      MAX_PARALLEL: default=2,e2e=1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build OrderBook.slnx -c Release
        name: Build the solution

      - id: suites
        name: Enumerate and pack suites (fails if a class has no suite)
        run: |
          set -euo pipefail
          MATRIX="$(./scripts/suites.sh --max-parallel "$MAX_PARALLEL")"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.leg.name }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # Every leg reports. Stopping the others on one failure hides whether the
      # problem is one class or the shared environment.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.discover.outputs.matrix).integration }}
        filter: ["integration.slnf"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # matrix.leg.args is a ready-made "-class A -class B", so the classes on
      # one leg run in a SINGLE process and share whatever fixture their
      # collection defines. Building the arguments here from an array would
      # lose that.
      # The solution FILTER, not the whole solution: an integration runner has
      # no reason to build the API or the e2e project, and building them is
      # time this leg pays for nothing.
      - name: Run ${{ matrix.leg.classes }}
        run: |
          set -euo pipefail
          dotnet build ${{ matrix.filter }} -c Release
          "${{ matrix.leg.exe }}" \
            ${{ matrix.leg.args }} \
            -trx "${{ matrix.leg.name }}.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.leg.name }}
          path: '*.trx' 
          if-no-files-found: error

  e2e:
    name: ${{ matrix.leg.name }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.discover.outputs.matrix).e2e }}
        filter: ["e2e.slnf"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Each leg builds its OWN facade, web app and browser. Testcontainers
      # randomises names, networks and host ports, so nothing needs coordinating
      # between runners -- the isolation is a property of the fixtures.
      # matrix.leg.args is a ready-made "-class A -class B", so the classes on
      # one leg run in a SINGLE process and share whatever fixture their
      # collection defines. Building the arguments here from an array would
      # lose that.
      # The solution FILTER, not the whole solution: an integration runner has
      # no reason to build the API or the e2e project, and building them is
      # time this leg pays for nothing.
      - name: Run ${{ matrix.leg.classes }}
        run: |
          set -euo pipefail
          dotnet build ${{ matrix.filter }} -c Release
          "${{ matrix.leg.exe }}" \
            ${{ matrix.leg.args }} \
            -trx "${{ matrix.leg.name }}.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.leg.name }}
          path: '*.trx' 
          if-no-files-found: error
