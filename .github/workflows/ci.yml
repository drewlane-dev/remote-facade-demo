name: ci

# Two layers, each fanning out over its own runners.
#
#   integration — the backend alone, driven through the facade
#   e2e         — the same backend with a web app and a browser in front
#
# They are separate stages rather than more legs of one because they cost
# different amounts to START. With container fixtures the wall-clock is
# dominated by bringing the environment up, so splitting evenly by test count
# would have every runner pay the same setup for a fraction of the work.
#
# Nothing here names a project or a class. scripts/suites.ps1 is called once
# per suite with that suite's filter and its tags, and finds the runners inside
# the filter by asking MSBuild which projects are IsTestingPlatformApplication.
# The filter is already what the legs below build, so what gets built and what
# gets run cannot drift apart.
#
# The tags are [TestCategory] on the test classes. MSTest cannot list test
# CLASS names without running the tests -- --list-tests reports method names
# only -- so tags are what the split is expressed in. It honours --filter
# during discovery, which is how the script proves, without running anything,
# that every test carries exactly one of the tags below. A test carrying none
# would run on no leg, which is indistinguishable from a leg that passed.
#
# The cap lives on the call, next to the filter it applies to, because the two
# are decided together. e2e is capped at 1 deliberately: its classes share a
# collection, so one leg runs them in a single process against ONE set of
# containers. Split across legs they each rebuild SQL Server, the API, the
# Angular host and a browser, which is 94-99% of a leg's wall-clock.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The failure mode here is not a commit: it is a new host release changing
    # something this demo relies on, and nothing would push here to reveal it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Every image the legs run is built ONCE here, pushed, and passed on as a
  # digest. Previously each e2e leg built the API and web images itself, so
  # what got tested was assembled on the agent, existed only there, and no leg
  # could prove it matched any other. Now the legs run the exact bytes this run
  # produced -- and a digest, not a tag, because a tag can be moved between the
  # push and the pull by a concurrent run of this same pipeline.
  images:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.refs.outputs.api }}
      web: ${{ steps.refs.outputs.web }}
      host: ${{ steps.refs.outputs.host }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repo root: both Dockerfiles COPY from src/, so a
      # per-project context would not see what they reference.
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OrderBook.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/orderbook-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OrderBook.Ui/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/orderbook-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: refs
        name: Collect digest references
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          echo "api=ghcr.io/$owner/orderbook-api@${{ steps.api.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/orderbook-ui@${{ steps.web.outputs.digest }}" >> "$GITHUB_OUTPUT"

          # The facade host is NOT built here -- it is a published release of
          # another repo -- but pinning it costs one lookup and gives the
          # integration legs the same guarantee: every leg runs one known host,
          # and the tag cannot move underneath the run.
          tag="$(cat facade-host.image)"
          digest="$(docker buildx imagetools inspect "$tag" | awk '/^Digest:/{print $2}')"
          echo "host=${tag%:*}@$digest" >> "$GITHUB_OUTPUT"

      - name: Show what the legs will run
        run: |
          echo "api  ${{ steps.refs.outputs.api }}"
          echo "web  ${{ steps.refs.outputs.web }}"
          echo "host ${{ steps.refs.outputs.host }}"

  discover:
    name: Discover suites
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.integration.outputs.legs }}
      e2e: ${{ steps.e2e.outputs.legs }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build OrderBook.slnx -c Release
        name: Build the solution

      - id: integration
        name: Pack the integration suite
        shell: pwsh
        run: |
          $legs = ./scripts/suites.ps1 -Sln integration.slnf
          $legs
          "legs=$legs" >> $env:GITHUB_OUTPUT

      - id: e2e
        name: Pack the e2e suite
        shell: pwsh
        run: |
          $legs = ./scripts/suites.ps1 -Sln e2e.slnf
          $legs
          "legs=$legs" >> $env:GITHUB_OUTPUT

  integration:
    name: ${{ matrix.leg.name }}
    needs: [discover, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      FACADE_HOST_IMAGE: ${{ needs.images.outputs.host }}
    strategy:
      # Every leg reports. Stopping the others on one failure hides whether the
      # problem is one class or the shared environment.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.discover.outputs.integration) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Testcontainers pulls through the Docker DAEMON, not through the .NET
      # process, so the credentials have to be on the daemon.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # matrix.leg.args is a ready-made --filter expression, so the tags on one
      # leg run in a SINGLE process and share the one [AssemblyInitialize]
      # environment. Building the filter here from an array would lose that.
      # The solution FILTER, not the whole solution: an integration runner has
      # no reason to build the API or the e2e project, and building them is
      # time this leg pays for nothing.
      - name: Run ${{ matrix.leg.tags }}
        run: |
          set -euo pipefail
          dotnet build ${{ matrix.leg.suite }}.slnf -c Release
          # --results-directory is not optional: MSTest writes the TRX beside
          # the test BINARY by default, not into the working directory, so the
          # upload below would find nothing.
          "${{ matrix.leg.exe }}" \
            ${{ matrix.leg.args }} \
            --report-trx --report-trx-filename "${{ matrix.leg.name }}.trx" \
            --results-directory .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.leg.name }}
          path: '*.trx' 
          if-no-files-found: error

  e2e:
    name: ${{ matrix.leg.name }}
    needs: [discover, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      E2E_API_IMAGE: ${{ needs.images.outputs.api }}
      E2E_WEB_IMAGE: ${{ needs.images.outputs.web }}
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.discover.outputs.e2e) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Testcontainers pulls through the Docker DAEMON, not through the .NET
      # process, so the credentials have to be on the daemon.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each leg builds its OWN facade, web app and browser. Testcontainers
      # randomises names, networks and host ports, so nothing needs coordinating
      # between runners -- the isolation is a property of the fixtures.
      # matrix.leg.args is a ready-made --filter expression, so the tags on one
      # leg run in a SINGLE process and share the one [AssemblyInitialize]
      # environment. Building the filter here from an array would lose that.
      # The solution FILTER, not the whole solution: an integration runner has
      # no reason to build the API or the e2e project, and building them is
      # time this leg pays for nothing.
      - name: Run ${{ matrix.leg.tags }}
        run: |
          set -euo pipefail
          dotnet build ${{ matrix.leg.suite }}.slnf -c Release
          # --results-directory is not optional: MSTest writes the TRX beside
          # the test BINARY by default, not into the working directory, so the
          # upload below would find nothing.
          "${{ matrix.leg.exe }}" \
            ${{ matrix.leg.args }} \
            --report-trx --report-trx-filename "${{ matrix.leg.name }}.trx" \
            --results-directory .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.leg.name }}
          path: '*.trx' 
          if-no-files-found: error
