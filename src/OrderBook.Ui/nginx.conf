server {
  listen 8080;
  root /usr/share/nginx/html;

  # Everything the browser fetches comes from THIS origin, including the API.
  # nginx proxies /api to the API container, so there is no cross-origin
  # request and therefore no CORS configuration anywhere in the demo -- which
  # is also how this is normally deployed.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # Angular routing is client-side: a hard navigation to /audit must still be
  # served index.html or the browser gets a 404 from nginx and the route never
  # runs.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
