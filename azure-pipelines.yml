# Suites discovered from the built assemblies, then run one leg per agent.
#
# The matrix is NOT written here. A hand-maintained list drifts the moment
# someone adds a test class, and it drifts silently: the class runs on no agent,
# every leg stays green, and nothing reports that coverage shrank.
# scripts/suites.ps1 is called once per suite with that suite's filter and its
# [TestCategory] tags, and refuses to emit a matrix unless every test in the
# filter carries exactly one of those tags -- proved during discovery, without
# running a test.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

stages:
  - stage: discover
    displayName: Discover suites
    jobs:
      - job: suites
        displayName: Enumerate parallelisable suites
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            inputs:
              version: '10.0.x'

          - script: dotnet build OrderBook.slnx -c Release
            displayName: Build tests

          # Publishing each matrix as an output variable is what lets the next
          # stage fan out over something computed rather than something typed.
          #
          # The cap sits on the call, beside the filter it applies to: e2e is
          # packed to one leg because its classes share a collection and one
          # leg runs them against a single set of containers.
          - pwsh: |
              $legs = ./scripts/suites.ps1 -Sln integration.slnf -Tags domain,graph -Ado
              Write-Host "integration: $legs"
              Write-Host "##vso[task.setvariable variable=legs;isOutput=true]$legs"
            name: emitIntegration
            displayName: Pack the integration suite

          - pwsh: |
              $legs = ./scripts/suites.ps1 -Sln e2e.slnf -Tags journey -Ado
              Write-Host "e2e: $legs"
              Write-Host "##vso[task.setvariable variable=legs;isOutput=true]$legs"
            name: emitE2e
            displayName: Pack the e2e suite

  - stage: test
    displayName: Run suites in parallel
    dependsOn: discover
    jobs:
      # One agent per leg, each building its own containers. Testcontainers
      # randomises names, networks and host ports, so nothing needs to be
      # coordinated between agents -- the isolation is a property of the
      # fixtures, which is why the suite boundary is the fixture boundary.
      #
      # Whether the legs actually overlap is the ORGANISATION's business, not
      # this file's: a private project with no parallel-jobs grant runs them
      # one after another, and the pipeline is correct either way.
      - job: integration
        displayName: Integration
        strategy:
          matrix: $[ stageDependencies.discover.suites.outputs['emitIntegration.legs'] ]
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: .ado/run-leg.yml

      - job: e2e
        displayName: E2E
        strategy:
          matrix: $[ stageDependencies.discover.suites.outputs['emitE2e.legs'] ]
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: .ado/run-leg.yml
