# Suites discovered from the built assembly, then run one per agent.
#
# The matrix is NOT written here. A hand-maintained list drifts the moment
# someone adds a test class, and it drifts silently: the class runs on no agent,
# every leg stays green, and nothing reports that coverage shrank.
# scripts/suites.ps1 takes the suites from the .slnf files and the classes from
# the compiled tests, and refuses to emit a matrix at all if a test project
# belongs to no filter.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

stages:
  - stage: discover
    displayName: Discover suites
    jobs:
      - job: suites
        displayName: Enumerate parallelisable suites
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            inputs:
              version: '10.0.x'

          - script: dotnet build OrderBook.slnx -c Release
            displayName: Build tests

          # Publishing the matrix as an output variable is what lets the next
          # stage fan out over something computed rather than something typed.
          - pwsh: |
              $matrix = ./scripts/suites.ps1 -MaxParallel default=2,e2e=1 -Ado
              Write-Host "matrix: $matrix"
              Write-Host "##vso[task.setvariable variable=matrix;isOutput=true]$matrix"
            name: emit
            displayName: Build matrix (fails if a test project has no filter)

  - stage: test
    displayName: Run suites in parallel
    dependsOn: discover
    jobs:
      - job: suite
        displayName: Suite
        # One agent per suite, each building its own containers. Testcontainers
        # randomises names, networks and host ports, so nothing needs to be
        # coordinated between agents -- the isolation is a property of the
        # fixtures, which is why the suite boundary is the fixture boundary.
        strategy:
          matrix: $[ stageDependencies.discover.suites.outputs['emit.matrix'] ]
        pool:
          vmImage: ubuntu-latest
        variables:
          # Each agent pulls the facade, web and browser images cold. This is
          # usually the largest single cost of a leg, and the reason suites are
          # split by fixture rather than by test count.
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
        steps:
          - task: UseDotNet@2
            inputs:
              version: '10.0.x'

          - script: |
              set -eu
              dotnet build "$(echo "$(Agent.JobName)" | sed "s/-[0-9]*$//").slnf" -c Release
              "$(EXE)" \
                $(ARGS) \
                -trx "$(Agent.JobName).trx"
            displayName: Run $(SUITE) / $(CLASSES)

          # ADO aggregates TRX from every leg into one test run, which is the
          # merge step Playwright's Node runner needs blob reports for.
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            displayName: Publish results
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '*.trx'
              searchFolder: '$(Build.SourcesDirectory)'
              testRunTitle: '$(SUITE) / $(CLASSES)'
              failTaskOnFailedTests: true
